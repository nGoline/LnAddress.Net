name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PROJECT: src/LnAddress.Net/LnAddress.Net.csproj
  IMAGE: ngoline/lnaddress.net

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Tag must match project version
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          csproj_version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' "$PROJECT")
          if [ "$tag" != "$csproj_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match <Version>$csproj_version</Version> in $PROJECT"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  binaries:
    name: Binaries
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish self-contained single-file builds
        run: |
          mkdir -p dist
          for rid in linux-x64 linux-arm64 linux-arm linux-musl-x64 osx-arm64 osx-x64 win-x64; do
            out="publish/$rid"
            dotnet publish "$PROJECT" -c Release -r "$rid" --self-contained true \
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None \
              -o "$out"
            rm -f "$out/appsettings.Development.json"
            name="lnaddress.net-$VERSION-$rid"
            if [[ $rid == win-* ]]; then
              (cd "$out" && zip -qr "$GITHUB_WORKSPACE/dist/$name.zip" .)
            else
              tar czf "dist/$name.tar.gz" -C "$out" .
            fi
          done
          (cd dist && sha256sum lnaddress.net-* > SHA256SUMS)

      - uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: dist/

  docker:
    name: Docker image
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=,format=short
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: src/LnAddress.Net
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  github-release:
    name: GitHub release
    needs: [ binaries, docker ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: binaries
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes
